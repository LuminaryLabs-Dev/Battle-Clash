name: Promote Battle Clash tier

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source tier"
        required: true
        type: choice
        options: [main, staging]
      target:
        description: "Target tier"
        required: true
        type: choice
        options: [staging, publish]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ inputs.source }}
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Enforce promotion order
        run: |
          case "${SOURCE}:${TARGET}" in
            main:staging|staging:publish) ;;
            *) echo "Only main -> staging -> publish is allowed" >&2; exit 1 ;;
          esac
      - name: Validate source tier
        run: |
          git fetch --no-tags origin "$SOURCE"
          git checkout --detach "origin/$SOURCE"
          npm ci
          BATTLE_CLASH_TIER="$SOURCE" BATTLE_CLASH_ENFORCE_TIER=true npm run check:all
          BATTLE_CLASH_TIER="$SOURCE" npm run audit:tier
      - name: Open protected promotion pull request
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET" --head "$SOURCE" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "Promotion PR already open: $existing"
            exit 0
          fi
          cat > promotion-body.md <<EOF
          ## Battle Clash tier promotion

          Promote the $SOURCE tier into the $TARGET tier.

          The source tier passed npm run check:all, the tier contract, and the
          release audit. Merge remains protected and requires the target branch
          review/check policy; this workflow never pushes directly to main.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$TARGET" --head "$SOURCE" \
            --title "Promote Battle Clash: $SOURCE -> $TARGET" \
            --body-file promotion-body.md
