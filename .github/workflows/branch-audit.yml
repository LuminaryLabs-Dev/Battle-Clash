name: Battle Clash branch tier audit

on:
  push:
    branches: [main, staging, publish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve tier policy
        run: |
          case "${GITHUB_REF_NAME}" in
            main|staging|publish) tier="${GITHUB_REF_NAME}" ;;
            *) tier="main" ;;
          esac
          echo "BATTLE_CLASH_TIER=$tier" >> "$GITHUB_ENV"
          echo "BATTLE_CLASH_ENFORCE_TIER=true" >> "$GITHUB_ENV"
      - run: npm run check:tier
      - run: npm run check:release
      - run: npm run check:domains
      - run: git diff --check
      - name: Write redacted tier audit
        env:
          TIER_AUDIT_PATH: tier-audit.json
          TIER_AUDIT_STATUS: policy-verified
          TIER_AUDIT_SEMANTIC: check:domains
        run: npm run audit:tier
      - uses: actions/upload-artifact@v4
        with:
          name: battle-clash-tier-audit-${{ github.run_id }}
          path: tier-audit.json
