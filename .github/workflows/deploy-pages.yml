name: Deploy Battle Clash tiered Pages

on:
  push:
    branches: [main, staging, publish]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the tiered Pages site is being rebuilt"
        required: false
        default: "manual release verification"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: battle-clash-pages-tiered
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch all public tier branches
        run: git fetch --no-tags origin main staging publish

      - name: Build and audit development, staging, and production paths
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-pages-tiers.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy combined Pages site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify development, staging, and production URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          for path in "/" "/staging/" "/publish/"; do
            html="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "${root}${path}")"
            printf '%s' "$html" | grep -q "<title>Battle Clash</title>"
            printf '%s' "$html" | grep -q "<script"
          done

      - name: Upload tier audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: battle-clash-tier-audits-${{ github.sha }}
          path: pages-site/release-audits
